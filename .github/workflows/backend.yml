name: Backend
on:
  push:
    paths: ['server/**', 'scripts/**', 'docker-compose*.yml', '.github/workflows/backend.yml', '.dockerignore']
  pull_request:
    paths: ['server/**', 'scripts/**', 'docker-compose*.yml', '.github/workflows/backend.yml', '.dockerignore']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pickup
          POSTGRES_PASSWORD: pickup-test
          POSTGRES_DB: pickup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U pickup' --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping' --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://pickup:pickup-test@localhost:5432/pickup_test
      TEST_REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.98.1 fmt --all -- --check
      - run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.98.1 test --locked --all-targets -- --include-ignored --test-threads=1
      - name: Verify advisory exception is unreachable
        run: |
          dependencies="$(cargo +1.98.1 tree --locked --target all --edges normal,build --prefix none)"
          if printf '%s\n' "$dependencies" | grep -E '^(rsa|sqlx-mysql|quinn|quinn-proto) v'; then
            echo 'An advisory-exception dependency is now compiled; remove and re-evaluate the audit exception.'
            exit 1
          fi
      - run: cargo +1.98.1 install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - run: docker build -f server/Dockerfile -t pickup-backend:ci .
        working-directory: .
      - name: Validate local infrastructure configuration
        working-directory: .
        env:
          JWT_SECRET: ci-validation-only-secret-not-for-deployment
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          sh -n scripts/init-mc.sh
